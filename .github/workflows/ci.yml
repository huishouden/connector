name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy halfway; superseded PR checks are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: huishouden/pwa-kit/actions/leak-scan@v0
      - uses: huishouden/pwa-kit/actions/license-check@v0 # PolyForm Shield 1.0.0 (pwa-kit STANDARD.md "License")

  # Typecheck, every tool against the Firestore and Auth emulators with the household's real rules
  # (huishouden/rules main), and the end-to-end sign-in with the MCP SDK client against wrangler dev.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/firebase/emulators
          key: ${{ runner.os }}-connector-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run e2e
      - name: Bundle (wrangler dry run)
        run: bunx wrangler deploy --dry-run --outdir dist --env ""

  # Tags the next version from the Conventional Commit titles and creates the release (pwa-kit STANDARD.md "Versions"); nothing is committed.
  release:
    needs: [leak-scan, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    uses: huishouden/pwa-kit/.github/workflows/tag-release.yml@v0.107.0
    permissions:
      contents: write

  # Deploys on main once the `production` environment has a CLOUDFLARE_API_TOKEN secret (README, "Deploy from GitHub
  # Actions"); skipped until then. Worker secrets stay in Cloudflare and are not touched.
  deploy:
    needs: [leak-scan, test, release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The Cloudflare token is a secret of the `production` environment, whose deployment branches
    # are main alone: no other branch's run can read it.
    environment: production
    strategy:
      matrix:
        env: [staging, '']
      max-parallel: 1
    steps:
      - name: Cloudflare token present?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - if: steps.token.outputs.present == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.token.outputs.present == 'true'
        run: bun install --frozen-lockfile
      - if: steps.token.outputs.present == 'true'
        run: bunx wrangler deploy --env "${{ matrix.env }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.token.outputs.present != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret; deploy with 'bun run deploy' and 'bun run deploy:staging' locally (README)."
